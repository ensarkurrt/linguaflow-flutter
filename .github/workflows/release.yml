name: Release Flutter SDK

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    permissions:
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: '3.35.4'
          channel: stable
          cache: true
      - run: node scripts/check-public-release-version.mjs
      - run: flutter pub get && git diff --exit-code -- pubspec.lock
      - run: flutter analyze && flutter test && dart pub publish --dry-run
      - name: Validate dependency licenses
        run: |
          dart pub global activate license_checker 1.6.2
          dart pub global run license_checker --config license-policy.yaml check-licenses
      - name: Build source archive
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          git archive --format=tar.gz --prefix="linguaflow-flutter-$version/" \
            --output="linguaflow-flutter-$version.tar.gz" "$GITHUB_SHA"
      - name: Attest Flutter archive provenance
        uses: actions/attest@f7c74d28b9d84cb8768d0b8ca14a4bac6ef463e6 # v4.2.0
        with:
          subject-path: linguaflow-flutter-*.tar.gz
      - name: Generate Flutter SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          path: .
          format: cyclonedx-json
          output-file: linguaflow-flutter.cdx.json
          upload-artifact: false
          upload-release-assets: false
      - name: Attest Flutter SBOM
        uses: actions/attest@f7c74d28b9d84cb8768d0b8ca14a4bac6ef463e6 # v4.2.0
        with:
          subject-path: linguaflow-flutter-*.tar.gz
          sbom-path: linguaflow-flutter.cdx.json

  publish:
    needs: validate
    permissions:
      id-token: write
    uses: dart-lang/setup-dart/.github/workflows/publish.yml@6afc89df92d6eb3834022f73cd65adc8cdfcb92d # v1
    with:
      environment: pub.dev
